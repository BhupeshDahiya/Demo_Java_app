services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_app
    environment:  # 'db' is the service name, Docker resolves it internally
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=mydatabase
      - DB_USER=admin
      - DB_PASSWORD=secret_password
    ports:
      - "8080:8080"   # Maps host port 8080 to container port 8080
    depends_on:
      db:
        condition: service_healthy            # Ensures the database container starts and is ready before the web application container starts

  # 2. The Database Container
  db:
    image: postgres:15.19-alpine3.23
    container_name: postgres_db
    environment:      
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret_password
      - POSTGRES_DB=mydatabase
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydatabase"]
      interval: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

# Named volumes for data persistence
volumes:
  db_data: