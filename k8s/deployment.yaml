apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-java-app
  labels:
    app: demo-java-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-java-app
  template:
    metadata:
      labels:
        app: demo-java-app
    spec:
      initContainers:
      - name: flyway-migrate
        image: flyway/flyway:10-alpine
        args:
        - -url=jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)
        - -user=$(DB_USER)
        - -password=$(DB_PASSWORD)
        - -locations=filesystem:/flyway/sql
        - migrate
        envFrom:
        - secretRef:
            name: demo-db-secret
        volumeMounts:
        - name: migrations
          mountPath: /flyway/sql

      containers:
      - name: demo-java-app
        image: <YOUR_REGISTRY>/demo-java-app:<IMAGE_TAG>
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: demo-db-secret
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10

      volumes:
      - name: migrations
        configMap:
          name: flyway-migrations
